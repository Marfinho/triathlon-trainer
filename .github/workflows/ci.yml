name: CI

# Typecheck, Tests und Build bei jedem Push auf main und bei Pull Requests.
# Deployt wird manuell auf dem Server (siehe DEPLOY.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ältere Läufe desselben Branches/PRs abbrechen, wenn neu gepusht wird.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: localhub
          POSTGRES_PASSWORD: localhub
          POSTGRES_DB: localhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://localhub:localhub@localhost:5432/localhub_test
      TEST_DATABASE_URL: postgresql://localhub:localhub@localhost:5432/localhub_test
      # Dummy-Secrets, damit der Build nicht an fehlenden Env-Vars scheitert.
      NEXTAUTH_SECRET: ci-dummy-secret-not-used-in-prod
      AUTH_SECRET: ci-dummy-secret-not-used-in-prod
      ENCRYPTION_KEY: ci-dummy-encryption-key-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma Client generieren
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
